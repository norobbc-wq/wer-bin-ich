const EVENING_KEY='familienabend:evening:v1';
let eveningMemory={},storageAvailable=true;
function readEvening(){try{const raw=localStorage.getItem(EVENING_KEY);const value=raw?JSON.parse(raw):{};if(value&&typeof value==='object'&&!Array.isArray(value)){eveningMemory=Object.fromEntries(Object.entries(value).filter(([k,v])=>['imposter','scharade','tabu','quiz','werbinich'].includes(k)&&Array.isArray(v)).map(([k,v])=>[k,v.filter(x=>typeof x==='string')]));storageAvailable=true}}catch{storageAvailable=false}return eveningMemory}
function writeEvening(value){eveningMemory=value;try{localStorage.setItem(EVENING_KEY,JSON.stringify(value));storageAvailable=true}catch{storageAvailable=false}}
function resetEvening(){writeEvening({})}

'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bi=(de,ar)=>`${esc(de)}<span class="ar" lang="ar" dir="rtl">${esc(ar)}</span>`;
const randomIndex=n=>{const a=new Uint32Array(1),max=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=max);return a[0]%n};
function shuffled(items){const out=items.slice();for(let i=out.length-1;i>0;i--){const j=randomIndex(i+1);[out[i],out[j]]=[out[j],out[i]]}return out}
let state=null,clock=null,deadline=0,remaining=0,pendingDelay=null;
const minPlayers=GAME==='imposter'?3:2;
const title=CONFIG.title;
const cardId=c=>String(GAME==='quiz'?c.question[0]:GAME==='tabu'?c.word[0]:c[0]).normalize('NFKC').toLocaleLowerCase('de').trim();
function availableCards(){const used=new Set(readEvening()[GAME]||[]);return DATA.filter(c=>!used.has(cardId(c)))}
function rememberCard(c){const history=readEvening();history[GAME]=[...new Set([...(history[GAME]||[]),cardId(c)])];writeEvening(history)}
function drawCard(){const cards=availableCards();if(!cards.length)return null;const c=cards[randomIndex(cards.length)];rememberCard(c);return c}

function button(id,de,ar,primary=false){return `<button id="${id}" ${primary?'class="primary"':''}>${bi(de,ar)}</button>`}
function setup(){stopTimer();clearTimeout(pendingDelay);state=null;$('app').innerHTML=`<div class="intro"><span class="eyebrow">${bi('FAMILIENABEND','أمسية عائلية')}</span><h1>${bi(...title)}</h1><p>${bi(...CONFIG.rules)}</p></div><form id="form" class="panel"><label for="count">${bi(GAME==='tabu'?'Anzahl der Teams':'Anzahl der Spieler',GAME==='tabu'?'عدد الفرق':'عدد اللاعبين')}</label><input id="count" type="number" min="${minPlayers}" value="${GAME==='imposter'?3:2}" step="1" required inputmode="numeric"><div id="names" class="names"></div>${GAME==='imposter'?`<label for="wordmode">${bi('Geheimes Wort','الكلمة السرية')}</label><select id="wordmode"><option value="random">Zufällig / عشوائي (${DATA.length})</option><option value="custom">Eigenes Wort / كلمة من اختيارك</option></select><div id="custom" class="hidden"><label for="word">${bi('Wort eingeben','اكتب الكلمة')}</label><input id="word" type="password" autocomplete="off" maxlength="100" dir="auto"><p class="hint">${bi('Wer das Wort eingibt, kennt es bereits. Am besten übernimmt das jemand, der nicht mitspielt.','من يكتب الكلمة يعرفها مسبقًا. يُفضّل أن يكتبها شخص لا يشارك في اللعب.')}</p></div>`:`<label for="rounds">${bi('Runden pro Spieler oder Team','الجولات لكل لاعب أو فريق')}</label><select id="rounds"><option value="2">2</option><option value="1">1</option><option value="3">3</option><option value="5">5</option></select>${GAME==='quiz'?'':`<label for="duration">${bi('Zeit pro Runde','وقت كل جولة')}</label><select id="duration"><option value="60">60 s / ثانية</option><option value="90">90 s / ثانية</option><option value="120">120 s / ثانية</option></select>`}`}<p id="error" class="error" role="alert"></p>${button('start','Spiel starten','ابدأ اللعب',true)}</form><div class="panel"><p role="status">${bi('Noch '+availableCards().length+' von '+DATA.length+' zufälligen Karten verfügbar.','تبقى '+availableCards().length+' من '+DATA.length+' بطاقة عشوائية.')}</p>${storageAvailable?'':`<p class="hint">${bi('Browserspeicher ist nicht verfügbar. Der Verlauf bleibt nur bis zum Neuladen erhalten.','التخزين غير متاح. يبقى السجل حتى إعادة تحميل الصفحة فقط.')}</p>`}${button('resetEvening','Neuer Spieleabend – Verlauf aller Spiele löschen','أمسية جديدة – مسح سجل جميع الألعاب')}</div><details><summary>${bi('Regeln','القواعد')}</summary><p>${bi(...CONFIG.detail)}</p></details>`;
function names(){const n=Number($('count').value);if(!Number.isSafeInteger(n)||n<minPlayers)return;const old=[...$('names').querySelectorAll('input')].map(x=>x.value);$('names').innerHTML=Array.from({length:n},(_,i)=>`<div><label for="n${i}">${bi((GAME==='tabu'?'Team ':'Spieler ')+(i+1),(GAME==='tabu'?'الفريق ':'اللاعب ')+(i+1))}</label><input id="n${i}" dir="auto" autocomplete="off" maxlength="60" required value="${esc(old[i]||'')}" placeholder="${GAME==='tabu'?'Team':'Name'} ${i+1}"></div>`).join('')}
$('resetEvening').onclick=()=>{resetEvening();setup()};$('count').onchange=names;names();if(GAME==='imposter')$('wordmode').onchange=()=>{const custom=$('wordmode').value==='custom';$('custom').classList.toggle('hidden',!custom);$('word').required=custom};
$('form').onsubmit=e=>{e.preventDefault();const n=Number($('count').value),players=[...$('names').querySelectorAll('input')].map(x=>x.value.trim());if(players.length!==n){names();$('error').innerHTML=bi('Bitte alle Namen ergänzen.','أكمل جميع الأسماء.');return}if(players.some(x=>!x)||new Set(players.map(x=>x.toLocaleLowerCase())).size!==n){$('error').innerHTML=bi('Bitte unterschiedliche, nicht leere Namen eingeben.','اكتب أسماء مختلفة وغير فارغة.');return}let customWord='';if(GAME==='imposter'&&$('wordmode').value==='custom'){customWord=$('word').value.trim();if(!customWord){$('error').innerHTML=bi('Bitte ein Wort eingeben.','اكتب كلمة.');return}}const rounds=GAME==='imposter'?1:Number($('rounds').value);if(!customWord&&(GAME==='imposter'?1:n*rounds)>availableCards().length){$('error').innerHTML=bi('Nicht genügend unbenutzte Karten. Bitte weniger Runden wählen oder einen neuen Spieleabend starten.','البطاقات غير المستخدمة لا تكفي. اختر جولات أقل أو ابدأ أمسية جديدة.');return}state={players,scores:players.map(()=>0),turn:0,total:n*rounds,duration:GAME==='quiz'||GAME==='imposter'?0:Number($('duration').value),deck:[],cursor:0,phase:'ready',card:null,imposter:GAME==='imposter'?randomIndex(n):-1,customWord};if(GAME==='imposter'){state.card=customWord?[customWord,'']:drawCard();state.phase='roles';state.revealed=false}document.activeElement?.blur?.();window.scrollTo(0,0);render()}}
function stopTimer(){if(clock)clearInterval(clock);clock=null}
function startTimer(){remaining=state.duration;deadline=Date.now()+remaining*1000;clock=setInterval(tick,200);tick()}
function tick(){if(!state||state.phase!=='playing')return;remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if($('timer'))$('timer').textContent=remaining;if(remaining===0){stopTimer();state.phase='expired';render()}}
function pauseTimer(){if(!state||state.phase!=='playing'||GAME==='quiz')return;remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));stopTimer();state.phase='paused';render()}
function cardPair(p){return bi(p[0],p[1]||'')}
function score(){return `<div class="score">${state.players.map((p,i)=>`<span dir="auto">${esc(p)} · ${state.scores[i]}</span>`).join('')}</div>`}
function wrapper(content){const progress=state.turn/state.total*100;return `<div class="panel"><div class="progress"><i style="width:${progress}%"></i></div>${content}</div>`}
function nextCard(){state.card=drawCard();return Boolean(state.card)}
function nextTurn(points){stopTimer();if(points)state.scores[state.turn%state.players.length]+=points;state.turn++;state.phase=state.turn>=state.total?'result':'ready';render()}
function render(){const app=$('app');if(GAME==='imposter'){renderImposter();return}const player=state.players[state.turn%state.players.length];if(state.phase==='result'){const best=Math.max(...state.scores),winners=state.players.filter((_,i)=>state.scores[i]===best);app.innerHTML=wrapper(`<div class="result"><span class="eyebrow">${bi('SPIELENDE','نهاية اللعبة')}</span><h1>${bi('Gut gespielt!','أحسنتم!')}</h1>${score()}<p>${bi('Vorne: '+winners.join(', '),'المتصدرون: '+winners.join('، '))}</p>${button('again','Neue Runde einrichten','إعداد لعبة جديدة',true)}</div>`);$('again').onclick=setup;return}
if(state.phase==='ready'){app.innerHTML=wrapper(`<div class="turn"><span class="eyebrow">${bi('RUNDE '+(state.turn+1)+' / '+state.total,'الجولة '+(state.turn+1)+' / '+state.total)}</span><h2 dir="auto">${esc(player)}</h2><p>${bi(...CONFIG.ready)}</p>${score()}${button('ready',GAME==='quiz'?'Frage zeigen':'Karte zeigen & starten',GAME==='quiz'?'عرض السؤال':'عرض البطاقة وبدء الوقت',true)}</div>`);$('ready').onclick=()=>{if(!nextCard()){stopTimer();setup();$('error').innerHTML=bi('Alle Karten wurden verwendet. Starte einen neuen Spieleabend.','استُخدمت جميع البطاقات. ابدأ أمسية جديدة.');return}state.phase='playing';state.answered=false;state.options=GAME==='quiz'?shuffled(state.card.options.map((p,i)=>({p,correct:i===0}))):null;render();if(GAME!=='quiz')startTimer()};return}
if(state.phase==='paused'){app.innerHTML=wrapper(`<div class="turn"><h2>${bi('Pause – Karte verdeckt','إيقاف مؤقت – البطاقة مخفية')}</h2><p>${bi('Restzeit: '+remaining+' Sekunden','الوقت المتبقي: '+remaining+' ثانية')}</p>${button('resume','Weiter','متابعة',true)}</div>`);$('resume').onclick=()=>{state.phase='playing';deadline=Date.now()+remaining*1000;render();clock=setInterval(tick,200);tick()};return}
if(state.phase==='expired'){app.innerHTML=wrapper(`<div class="turn"><h2>${bi('Zeit abgelaufen','انتهى الوقت')}</h2><div class="card"><h2>${cardPair(GAME==='tabu'?state.card.word:state.card)}</h2></div><div class="actions">${button('done','Noch rechtzeitig erraten (+1)','تم التخمين قبل انتهاء الوقت (+1)')}${button('miss','Nicht erraten','لم يتم التخمين')}</div></div>`);$('done').onclick=()=>nextTurn(1);$('miss').onclick=()=>nextTurn(0);return}
if(GAME==='quiz'){renderQuiz(player);return}
const pair=GAME==='tabu'?state.card.word:state.card;app.innerHTML=wrapper(`<div class="turn"><h2 dir="auto">${esc(player)}</h2><div id="timer" class="timer" role="timer">${remaining||state.duration}</div><p class="hint">${bi('Sekunden','ثانية')}</p><div class="card"><h2>${cardPair(pair)}</h2>${GAME==='tabu'?`<p class="error">${bi('Diese Wörter sind verboten – in beiden Sprachen','هذه الكلمات ممنوعة باللغتين')}</p><ul class="forbidden">${state.card.forbidden.map(p=>`<li>${cardPair(p)}</li>`).join('')}</ul>`:''}</div><div class="actions">${button('done','Erraten (+1)','تم التخمين (+1)')}${button('miss',GAME==='tabu'?'Verbotenes Wort / überspringen':'Überspringen',GAME==='tabu'?'كلمة ممنوعة / تخطّي':'تخطّي')}</div>${button('pause','Pause & verdecken','إيقاف مؤقت وإخفاء')}</div>`);$('done').onclick=()=>nextTurn(1);$('miss').onclick=()=>nextTurn(0);$('pause').onclick=pauseTimer}
function renderQuiz(player){const c=state.card;const app=$('app');app.innerHTML=wrapper(`<div class="turn"><span class="eyebrow">${bi('FRAGE '+(state.turn+1)+' / '+state.total,'السؤال '+(state.turn+1)+' / '+state.total)}</span><h2 dir="auto">${esc(player)}</h2><div class="card"><h2>${cardPair(c.question)}</h2></div><div class="options">${state.options.map((o,i)=>`<button id="o${i}" ${state.answered?'disabled':''} class="${state.answered?(o.correct?'correct':state.chosen===i?'wrong':''):''}">${cardPair(o.p)}</button>`).join('')}</div>${state.answered?`<p>${bi(state.options[state.chosen].correct?'Richtig! +1 Punkt':'Leider falsch. Grün zeigt die richtige Antwort.',state.options[state.chosen].correct?'صحيح! نقطة واحدة':'إجابة خاطئة. الإجابة الصحيحة باللون الأخضر.')}</p>${button('next','Nächste Frage','السؤال التالي',true)}`:''}</div>`);if(state.answered)$('next').onclick=()=>nextTurn(0);else state.options.forEach((o,i)=>$('o'+i).onclick=()=>{if(state.answered)return;state.answered=true;state.chosen=i;if(o.correct)state.scores[state.turn%state.players.length]++;render()})}
function renderImposter(){const app=$('app');if(state.phase==='roles'){const p=state.players[state.turn];app.innerHTML=wrapper(`<div class="turn"><span class="eyebrow">${bi('ROLLE '+(state.turn+1)+' / '+state.players.length,'الدور '+(state.turn+1)+' / '+state.players.length)}</span><h2 dir="auto">${esc(p)}</h2><p>${bi('Nur du darfst jetzt auf den Bildschirm schauen. Danach verdecken und weitergeben.','انظر إلى الشاشة وحدك، ثم أخفِ البطاقة ومرّر الهاتف.')}</p><div class="card ${state.turn===state.imposter&&state.revealed?'danger':''}"><h2>${state.revealed?(state.turn===state.imposter?bi('Du bist der Imposter','أنت المحتال'):cardPair(state.card)):bi('Rolle verdeckt','الدور مخفي')}</h2>${state.revealed?`<p>${state.turn===state.imposter?bi('Hör gut zu und bluffe mit.','استمع جيدًا وتظاهر بأنك تعرف الكلمة.'):bi('Gib einen Hinweis, ohne das Wort zu nennen.','أعطِ تلميحًا دون ذكر الكلمة.')}</p>`:''}</div>${button('role',state.revealed?'Verdecken & weitergeben':'Meine Rolle ansehen',state.revealed?'إخفاء البطاقة وتمرير الهاتف':'عرض دوري',true)}</div>`);$('role').onclick=()=>{if(!state.revealed)state.revealed=true;else{state.revealed=false;state.turn++;if(state.turn===state.players.length)state.phase='discussion'}render()};return}
if(state.phase==='discussion'){if(state.starter===undefined)state.starter=randomIndex(state.players.length);app.innerHTML=wrapper(`<div class="turn"><h1>${bi('Wer blufft?','من يتظاهر؟')}</h1><p>${bi(state.players[state.starter]+' beginnt. Jeder nennt einen Hinweis. Diskutiert und stimmt gemeinsam ab.',state.players[state.starter]+' يبدأ. يعطي كل لاعب تلميحًا، ثم تناقشوا وصوّتوا.')}</p><label for="suspect">${bi('Wen verdächtigt ihr?','من تتهمون؟')}</label><select id="suspect">${state.players.map((p,i)=>`<option value="${i}">${esc(p)}</option>`).join('')}</select>${button('reveal','Abstimmung beendet – aufdecken','انتهى التصويت – كشف الدور',true)}</div>`);$('reveal').onclick=()=>{state.suspect=Number($('suspect').value);state.phase='result';render()};return}
app.innerHTML=wrapper(`<div class="result"><h1>${bi('Die Auflösung','كشف النتيجة')}</h1><h2 dir="auto">${esc(state.players[state.imposter])}</h2><p>${bi('war der Imposter.','كان المحتال.')}</p><p>${state.suspect===state.imposter?bi('Ihr habt den Imposter gefunden!','وجدتم المحتال!'):bi('Der Imposter hat euch getäuscht!','خدعكم المحتال!')}</p><div class="card"><h2>${cardPair(state.card)}</h2></div>${button('again','Neue Runde einrichten','إعداد لعبة جديدة',true)}</div>`);$('again').onclick=setup}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(GAME==='imposter'&&state?.phase==='roles'&&state.revealed){state.revealed=false;render()}else pauseTimer()}});
setup();
// Direct editing: the keyboard action advances through visible inputs, then dismisses.
function editableFields(){return [...document.querySelectorAll('#app input')].filter(input=>!input.disabled&&input.type!=='hidden'&&!input.closest('.hidden'))}
function prepareKeyboardHints(){const fields=editableFields();fields.forEach((input,i)=>{input.enterKeyHint=i===fields.length-1?'done':'next'})}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing||!e.target.matches('#app input'))return;e.preventDefault();const current=e.target;current.dispatchEvent(new Event('change',{bubbles:true}));const fields=editableFields(),index=fields.indexOf(current),next=fields[index+1];if(index>=0&&next)next.focus();else current.blur();prepareKeyboardHints()});
new MutationObserver(prepareKeyboardHints).observe($('app'),{childList:true,subtree:true,attributes:true,attributeFilter:['class','disabled']});
prepareKeyboardHints();
</script></body></html>
